<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Car | DriveEasy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        body{
            background:linear-gradient(135deg,#0d6efd,#20c997);
            font-family:Arial,Helvetica,sans-serif;
        }

        .booking-box{
            max-width:700px;
            margin:50px auto;
            background:#fff;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.2);
        }

        h2{
            text-align:center;
            color:#0d6efd;
            margin-bottom:30px;
        }

        .btn-book{
            width:100%;
            padding:12px;
            font-size:18px;
            font-weight:bold;
        }
    </style>

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand text-warning" th:href="@{/}">
            <i class="fa-solid fa-car-side"></i> DriveEasy
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/}">Home</a>
            <a class="nav-link" th:href="@{/cars}">Cars</a>
            <a class="nav-link active" th:href="@{/booking}">Book Car</a>
            <a class="nav-link" th:href="@{/contact}">Contact</a>
        </div>

    </div>
</nav>

<div class="container">

    <div class="booking-box">

        <h2>
            <i class="fa-solid fa-calendar-check"></i>
            Car Booking Form
        </h2>

        <form th:action="@{/booking/save}" method="post">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Customer Name</label>
                    <input type="text"
                           class="form-control"
                           name="customerName"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email"
                           class="form-control"
                           name="email"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="tel"
                           class="form-control"
                           name="phone"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Select Car</label>

                    <select class="form-select" name="car">
                        <option>BMW X5</option>
                        <option>Audi A6</option>
                        <option>Mahindra Thar</option>
                        <option>Hyundai Creta</option>
                        <option>Toyota Fortuner</option>
                        <option>Mercedes C-Class</option>
                    </select>

                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Pickup Date</label>
                    <input type="date"
                           class="form-control"
                           name="pickupDate"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Return Date</label>
                    <input type="date"
                           class="form-control"
                           name="returnDate"
                           required>
                </div>

                <div class="col-12 mb-3">
                    <label class="form-label">Pickup Location</label>
                    <input type="text"
                           class="form-control"
                           name="pickupLocation"
                           placeholder="Enter Pickup Location"
                           required>
                </div>

                <div class="col-12 mb-3">
                    <label class="form-label">Special Request</label>
                    <textarea class="form-control"
                              rows="4"
                              name="message"
                              placeholder="Any special requirements?"></textarea>
                </div>

                <div class="col-12">

                    <button class="btn btn-primary btn-book">
                        <i class="fa-solid fa-car"></i>
                        Confirm Booking
                    </button>

                </div>

            </div>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
